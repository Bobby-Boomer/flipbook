<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Science of Online Entrepreneurship</title>
<meta name="description" content="Read The Science of Online Entrepreneurship by Bobby Boomer.">

<!--
  Flipbook viewer. One file, no build step.

  PDF.js renders each page to a canvas; StPageFlip turns those canvases into a
  page-turning book. Both come from a CDN, so there is nothing to install.

  Written 2026-09-21 by Lefty, from a brief by Larry. The brief's own viewer was
  never delivered, so this is a clean build we own outright.

  TO REUSE FOR ANOTHER PDF: drop the new file in beside this one and change
  PDF_URL. Nothing else needs touching.

  The PDF must be served from THIS origin. A cross-site PDF is blocked by the
  browser, which is why the file is committed to the repo rather than hotlinked
  from the CDN it already lives on.
-->

<style>
  :root{
    --bg:#0e1116; --panel:#171c24; --line:#2a323d; --txt:#e8edf3; --dim:#9aa4b2;
    --accent:#3fb950; --shadow:0 18px 50px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ---- loading ---- */
  #loading{
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px; background:var(--bg); z-index:50;
  }
  #loading h1{font-size:22px;font-weight:600;margin:0;text-align:center;padding:0 24px}
  #bar{width:min(340px,70vw);height:6px;background:#222b36;border-radius:99px;overflow:hidden}
  #bar div{height:100%;width:0;background:var(--accent);transition:width .18s ease}
  #pct{color:var(--dim);font-size:14px;font-variant-numeric:tabular-nums}
  #loading.hide{opacity:0;pointer-events:none;transition:opacity .4s ease}

  /* ---- book ---- */
  #stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 14px 6px;min-height:0}
  #book{box-shadow:var(--shadow)}
  #book .page{background:#fff}
  #book canvas{display:block;width:100%;height:100%}

  /* ---- controls ---- */
  #bar2{
    display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--panel);
    border-top:1px solid var(--line);
  }
  button{
    background:#222b36; color:var(--txt); border:1px solid var(--line); border-radius:9px;
    padding:10px 16px; font:600 15px inherit; cursor:pointer;
  }
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.38;cursor:default}
  #count{color:var(--dim);font-size:15px;min-width:118px;text-align:center;font-variant-numeric:tabular-nums}
  a.dl{
    background:var(--accent); color:#06210f; border:0; border-radius:9px;
    padding:10px 16px; font:700 15px inherit; text-decoration:none;
  }
  #err{display:none;padding:28px;text-align:center;color:var(--dim);max-width:560px;margin:auto}
  #err b{color:var(--txt)}
  @media (max-width:640px){
    #count{min-width:96px;font-size:14px}
    button,a.dl{padding:9px 13px;font-size:14px}
  }
</style>
</head>
<body>

<div id="loading">
  <h1>The Science of Online Entrepreneurship</h1>
  <div id="bar"><div></div></div>
  <div id="pct">Loading…</div>
</div>

<div id="stage"><div id="book"></div></div>
<div id="err"></div>

<div id="bar2">
  <button id="prev" disabled>‹ Back</button>
  <span id="count">—</span>
  <button id="next" disabled>Next ›</button>
  <button id="full">Full screen</button>
  <a class="dl" id="dl" href="book.pdf" download>Download PDF</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(function () {
  'use strict';

  // ---- the two things you might change --------------------------------
  const PDF_URL      = 'book.pdf';
  const RENDER_SCALE = 2;      // higher = sharper pages, slower first load
  const FIRST_PAGE   = 2;      // page 1 of this PDF is blank; the cover is page 2.
                               // The Download button still serves the whole file.
  // ---------------------------------------------------------------------

  const $ = id => document.getElementById(id);
  const loading = $('loading'), barFill = $('bar').firstElementChild, pct = $('pct');
  const stage = $('stage'), bookEl = $('book'), count = $('count');
  const prev = $('prev'), next = $('next'), full = $('full'), err = $('err');

  const fail = msg => {
    loading.classList.add('hide');
    stage.style.display = 'none';
    err.style.display = 'block';
    err.innerHTML = '<b>The book could not be loaded.</b><br><br>' + msg +
      '<br><br>You can still <a class="dl" href="book.pdf" download>download the PDF</a>.';
  };

  if (!window.pdfjsLib || !window.St) {
    return fail('A required library did not load. Check the connection and refresh.');
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // Portrait phones get one page at a time; anything wider gets a spread.
  const isPhone = () => window.matchMedia('(max-width: 820px)').matches;

  // Fit the book to whatever room the stage actually has, preserving page ratio.
  function sizeFor(ratio) {
    const pad = 28;
    const availW = stage.clientWidth  - pad;
    const availH = stage.clientHeight - pad;
    const perPage = isPhone() ? 1 : 2;
    let h = availH;
    let w = h * ratio * perPage;
    if (w > availW) { w = availW; h = w / (ratio * perPage); }
    return { w: Math.floor(w / perPage), h: Math.floor(h) };
  }

  (async function main() {
    let pdf;
    try {
      const task = pdfjsLib.getDocument(PDF_URL);
      task.onProgress = p => {
        if (!p.total) return;
        const f = Math.min(1, p.loaded / p.total) * 0.35;   // download is the first third
        barFill.style.width = (f * 100).toFixed(0) + '%';
        pct.textContent = 'Downloading… ' + Math.round(f / 0.35 * 100) + '%';
      };
      pdf = await task.promise;
    } catch (e) {
      return fail('The PDF could not be downloaded. It may be missing from the server.');
    }

    const total = pdf.numPages - (FIRST_PAGE - 1);
    const first = await pdf.getPage(FIRST_PAGE);
    const vp1 = first.getViewport({ scale: 1 });
    const ratio = vp1.width / vp1.height;

    // Render every page to its own canvas.
    const pages = [];
    for (let i = FIRST_PAGE; i <= pdf.numPages; i++) {
      const shown = i - FIRST_PAGE + 1;
      const page = await pdf.getPage(i);
      const vp = page.getViewport({ scale: RENDER_SCALE });
      const c = document.createElement('canvas');
      c.width = Math.floor(vp.width);
      c.height = Math.floor(vp.height);
      await page.render({ canvasContext: c.getContext('2d', { alpha: false }), viewport: vp }).promise;

      const wrap = document.createElement('div');
      wrap.className = 'page';
      wrap.appendChild(c);
      pages.push(wrap);

      const f = 0.35 + (shown / total) * 0.65;
      barFill.style.width = (f * 100).toFixed(0) + '%';
      pct.textContent = 'Preparing page ' + shown + ' of ' + total;
    }

    pages.forEach(p => bookEl.appendChild(p));

    // 'stretch' sizes the book from its container and ignores the numbers
    // given here, which let it grow to 1086px tall inside a 731px stage and
    // pushed the top of the book off-screen. Fixed sizing, recomputed on
    // resize, is what actually keeps it in the box.
    let { w, h } = sizeFor(ratio);
    bookEl.style.width  = (isPhone() ? w : w * 2) + 'px';
    bookEl.style.height = h + 'px';
    const flip = new St.PageFlip(bookEl, {
      width: w, height: h,
      size: 'fixed',
      maxShadowOpacity: 0.5,
      showCover: true,
      usePortrait: isPhone(),
      mobileScrollSupport: false,
      drawShadow: true
    });
    flip.loadFromHTML(document.querySelectorAll('#book .page'));

    // After the cover, a desktop book shows two pages at once, so the counter
    // reads as a spread ("Pages 4-5 of 49") rather than just the left-hand page.
    const paint = () => {
      const i = flip.getCurrentPageIndex();
      const spread = !isPhone() && i > 0 && i < total - 1;
      count.textContent = spread
        ? 'Pages ' + (i + 1) + '\u2013' + (i + 2) + ' of ' + total
        : 'Page ' + (i + 1) + ' of ' + total;
      prev.disabled = i <= 0;
      next.disabled = i >= total - 1;
    };
    flip.on('flip', paint);
    paint();

    prev.onclick = () => flip.flipPrev();
    next.onclick = () => flip.flipNext();

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft')  flip.flipPrev();
      if (e.key === 'ArrowRight') flip.flipNext();
    });

    full.onclick = () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else (document.documentElement.requestFullscreen || function(){})
             .call(document.documentElement);
    };
    document.addEventListener('fullscreenchange', () => {
      full.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
      setTimeout(resize, 120);
    });

    let t;
    function resize() {
      const s = sizeFor(ratio);
      bookEl.style.width  = (isPhone() ? s.w : s.w * 2) + 'px';
      bookEl.style.height = s.h + 'px';
      try { flip.update({ width: s.w, height: s.h, usePortrait: isPhone() }); } catch (e) {}
    }
    window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(resize, 160); });

    loading.classList.add('hide');
    setTimeout(() => loading.remove(), 450);
  })();
})();
</script>
</body>
</html>
